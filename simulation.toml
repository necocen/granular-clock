# Global simulation settings shared by CPU/GPU paths.
# Lengths are in mm; other quantities use the units noted below.
[simulation]
# Gravity acceleration [m/s^2]
gravity = [0.0, -9.80665, 0.0]

# Particle population and size.
[simulation.particle]
# Particle radius [mm]
large_radius = 10.0
small_radius = 5.0
# Number of particles by type
num_large = 160
num_small = 1440

# Particle-particle contact material properties.
[simulation.particle.material]
# Density [kg/m^3]
density = 2500.0
# Young's modulus [Pa] and dimensionless Poisson ratio
youngs_modulus = 5.0e6
poisson_ratio = 0.3
# Collision/friction parameters
restitution = 0.977
friction = 0.509
rolling_friction = 0.005

# Container box dimensions.
[simulation.container.box]
# Full box size [mm] (not half extents)
size = [400.0, 700.0, 100.0]

# Divider geometry inside the container.
[simulation.container.divider]
# Divider height from container floor [mm]
height = 87.5
# Divider thickness [mm]
thickness = 10.0

# Particle-wall contact properties.
[simulation.container.material]
# Penalty-model wall stiffness [N/m] and damping [N s/m]
stiffness = 10000.0
damping = 20.0
# Wall friction and restitution
restitution = 0.7
friction = 0.3

# Vertical sinusoidal oscillation of the container.
[simulation.oscillation]
# Amplitude [mm], frequency [Hz]
amplitude = 20.475
frequency = 23.0

# Integration step settings.
[simulation.step]
# Substep time interval [s]
dt = 0.0004
# Number of physics substeps per rendered frame
substeps_per_frame = 10

# UI slider ranges for runtime controls.
[ui.oscillation]
# Amplitude range and step [mm]
amplitude = { min = 1.0, max = 120.0, step = 1.0 }
frequency = { min = 1.0, max = 50.0, step = 1.0 }

[ui.step]
substeps_per_frame = { min = 1, max = 20, step = 1 }

[ui.container]
# Divider height range and step [mm]
divider_height = { min = 30.0, max = 470.0, step = 1.0 }

[ui.camera]
# Camera position and target [mm]
position = [300.0, 150.0, 750.0]
# Camera look-at target [mm].
target = [0.0, -150.0, 0.0]

[ui.light]
# Independent, unitless linear light gains; zero disables that light.
# Fill shadowed faces so particles stay readable against the dark background.
ambient_intensity = 0.4
directional_intensity = 0.8
# Opaque particles cast shadows; transparent container pieces receive them.
shadows_enabled = true

[ui.contact]
particle_restitution = { min = 0.0, max = 1.0, step = 0.01 }
particle_friction = { min = 0.0, max = 2.0, step = 0.01 }
wall_restitution = { min = 0.0, max = 1.0, step = 0.01 }
wall_friction = { min = 0.0, max = 2.0, step = 0.01 }
