[package]
name = "granular-clock"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "granular-clock"

[[bin]]
name = "cpu-worker"
path = "src/bin/cpu-worker.rs"
test = false
bench = false

[dependencies]
mikage = { git = "https://github.com/necocen/mikage.git", tag = "v0.9.3" }
tracing = "0.1"
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
egui_plot = "0.38"
rand = "0.9"
parking_lot = "0.12.5"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
glam = { version = "0.34", features = ["serde"] }
toml = "0.9"
web-time = "1.1"

[target.'cfg(target_family = "wasm")'.dependencies]
# WASM-only dependencies
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent",
    "DedicatedWorkerGlobalScope", "Window", "Document", "Location",
] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
pollster = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

[profile.release-wasm]
panic = "abort"
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
